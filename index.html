<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOOTBALL MATRIX </title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{font-family:'Inter';background:#070A14;color:white}
header{padding:16px 20px;background:#0F1424;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-family:'Montserrat';font-weight:800} .logo span{color:#22C55E}
.grid{max-width:1300px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:#151B2D;border:1px solid #1E293B;border-radius:16px;padding:16px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);border-color:#22C55E;box-shadow:0 10px 30px rgba(34,197,94,0.15)}
.top{display:flex;gap:12px;align-items:center}
.avatar{width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,#22C55E,#16A34A);display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:18px}
.meta h3{font-size:16px} .meta p{font-size:12px;opacity:.6}
.stats-row{display:flex;justify-content:space-between;margin-top:14px;background:#0A0E1A;padding:10px;border-radius:10px}
.stats-row div{text-align:center} .stats-row strong{display:block;font-size:16px} .stats-row span{font-size:10px;opacity:.5;letter-spacing:1px}
.value-tag{position:absolute;top:12px;right:12px;background:#22C55E;color:#000;font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px}
.level{margin-top:10px;display:flex;gap:6px} .pill{font-size:10px;padding:4px 8px;border-radius:20px;background:#1F2937}

/* MODAL */
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-box{background:#111827;width:100%;max-width:700px;border-radius:20px;overflow:hidden;border:1px solid #22C55E}
.modal-head{padding:20px;background:#151B2D;display:flex;gap:15px;align-items:center}
.modal-body{padding:20px} table{width:100%;border-collapse:collapse;margin-top:15px} th,td{padding:10px;text-align:left;font-size:13px;border-bottom:1px solid #1F2937} th{color:#9CA3AF;font-size:11px}
.close{margin-left:auto;background:#1F2937;border:none;color:white;width:32px;height:32px;border-radius:50%;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">FOOTBALL <span>MATRIX</span></div><input id="search" placeholder="Search player..." style="padding:10px 14px;border-radius:8px;border:1px solid #374151;background:#1F2937;color:white" onkeyup="search()"></header>

<div class="grid" id="grid"></div>

<div id="modal" onclick="if(event.target==this)closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <div class="avatar" id="mAvatar">PM</div>
      <div><h2 id="mName">Player Name</h2><p id="mClub" style="opacity:.6;font-size:13px"></p></div>
      <button class="close" onclick="closeModal()">X</button>
    </div>
    <div class="modal-body">
      <h4 style="color:#22C55E">Performance Timeline</h4>
      <table id="timeline"><tr><th>Season</th><th>Level</th><th>Apps</th><th>G/A</th><th>Rating</th></tr></table>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px">
        <div style="background:#0A0E1A;padding:12px;border-radius:10px"><small style="opacity:.5">STRENGTH</small><br><strong id="mStrength">Pace, Finishing</strong></div>
        <div style="background:#0A0E1A;padding:12px;border-radius:10px"><small style="opacity:.5">MARKET VALUE</small><br><strong id="mValue">€2.4M</strong></div>
      </div>
    </div>
  </div>
</div>

<script>
const players=[
{id:1,name:"Patson Daka",pos:"ST",club:"Leicester City / Zambia",initials:"PD",level:["Senior","U23","Youth"],apps:32,goals:14,assists:5,rating:7.8,value:"€4.2M",strength:"Finishing, Movement",timeline:[["2024/25","Senior",32,"14/5",7.8],["2022/23","Senior",28,"9/3",7.2],["2020/21","U23",22,"18/4",8.1]]},
{id:2,name:"Enock Mwepu",pos:"CM",club:"Brighton / Zambia",initials:"EM",level:["Senior"],apps:18,goals:2,assists:6,rating:7.4,value:"€3.8M",strength:"Passing, Vision",timeline:[["2023/24","Senior",18,"2/6",7.4],["2021/22","Senior",24,"4/5",7.6]]},
{id:3,name:"Mwila Kangwa",pos:"LW",club:"Zanaco FC",initials:"MK",level:["U23","Youth"],apps:24,goals:9,assists:7,rating:6.9,value:"€180K",strength:"Dribbling, Pace",timeline:[["2024/25","U23",24,"9/7",6.9],["2023/24","Youth",18,"11/5",7.3]]},
{id:4,name:"Joseph Chanda",pos:"CB",club:"Kabwe Youth",initials:"JC",level:["Youth"],apps:12,goals:0,assists:0,rating:6.5,value:"€25K",strength:"Tackling, Aerial",timeline:[["2024/25","Youth",12,"0/0",6.5]]},
];

function render(list){
  document.getElementById('grid').innerHTML=list.map(p=>`
    <div class="card" onclick="openModal(${p.id})">
      <div class="value-tag">${p.value}</div>
      <div class="top"><div class="avatar">${p.initials}</div><div class="meta"><h3>${p.name}</h3><p>${p.pos} • ${p.club}</p></div></div>
      <div class="stats-row"><div><strong>${p.apps}</strong><span>APPS</span></div><div><strong>${p.goals}</strong><span>GOALS</span></div><div><strong>${p.assists}</strong><span>ASSISTS</span></div><div><strong style="color:#22C55E">${p.rating}</strong><span>RATING</span></div></div>
      <div class="level">${p.level.map(l=>`<span class="pill">${l}</span>`).join('')}</div>
    </div>
  `).join('');
}
function openModal(id){
  let p=players.find(x=>x.id==id);
  document.getElementById('mAvatar').innerText=p.initials;
  document.getElementById('mName').innerText=p.name+' - '+p.pos;
  document.getElementById('mClub').innerText=p.club;
  document.getElementById('mStrength').innerText=p.strength;
  document.getElementById('mValue').innerText=p.value;
  document.getElementById('timeline').innerHTML='<tr><th>Season</th><th>Level</th><th>Apps</th><th>G/A</th><th>Rating</th></tr>'+p.timeline.map(t=>`<tr><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td><td>${t[4]}</td></tr>`).join('');
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none'}
function search(){let q=document.getElementById('search').value.toLowerCase();render(players.filter(p=>p.name.toLowerCase().includes(q)))}
render(players);
</script>
</body>
</html>
